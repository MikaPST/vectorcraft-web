name: Build and publish VectorCraft Web

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Official upstream release tag (empty = latest)"
        required: false
        type: string
      force_rebuild:
        description: "Rebuild an already published release"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - "nginx.conf"
      - ".dockerignore"

permissions:
  contents: write
  packages: write

concurrency:
  group: vectorcraft-web-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4
        with:
          path: packaging

      - name: Validate packaging files
        run: |
          set -euo pipefail
          test -s packaging/Dockerfile
          test -s packaging/nginx.conf
          test -s packaging/.dockerignore

      - name: Resolve official upstream release
        id: upstream-release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        with:
          script: |
            const requested = (process.env.REQUESTED_TAG || '').trim();
            const args = { owner: 'storytold', repo: 'vectorcraft' };
            const { data: release } = requested
              ? await github.rest.repos.getReleaseByTag({ ...args, tag: requested })
              : await github.rest.repos.getLatestRelease(args);
            if (!release.tag_name) throw new Error('No upstream release tag found');
            core.setOutput('tag', release.tag_name);
            core.setOutput('name', release.name || `VectorCraft ${release.tag_name}`);
            core.setOutput('url', release.html_url);
            core.setOutput('published_at', release.published_at || '');
            core.setOutput('prerelease', String(release.prerelease));

      - name: Check existing packaging release
        id: release-check
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.upstream-release.outputs.tag }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
        with:
          script: |
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...context.repo, tag: process.env.TAG });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const forced = process.env.FORCE_REBUILD === 'true' || context.eventName === 'push';
            core.setOutput('skip', String(exists && !forced));

      - name: Checkout official VectorCraft release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/vectorcraft
          ref: ${{ steps.upstream-release.outputs.tag }}
          path: vectorcraft-src
          persist-credentials: false

      - name: Checkout craft-fonts
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          path: craft-fonts
          persist-credentials: false

      - name: Record upstream commits
        if: steps.release-check.outputs.skip != 'true'
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "vectorcraft=$(git -C vectorcraft-src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git -C vectorcraft-src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "fonts=$(git -C craft-fonts rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          test -s vectorcraft-src/apps/vectorcraft-web/Trunk.toml
          test -s vectorcraft-src/LICENSE-MIT
          test -s vectorcraft-src/LICENSE-APACHE

      - name: Install Rust and WASM target
        if: steps.release-check.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        if: steps.release-check.outputs.skip != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: vectorcraft-src -> target

      - name: Install Trunk
        if: steps.release-check.outputs.skip != 'true'
        run: cargo install trunk --locked

      - name: Build official VectorCraft Web
        if: steps.release-check.outputs.skip != 'true'
        working-directory: vectorcraft-src/apps/vectorcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: trunk build --release

      - name: Assemble Docker build context
        if: steps.release-check.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docker-context/site docker-context/legal
          cp -a vectorcraft-src/dist/web/. docker-context/site/
          cp packaging/Dockerfile packaging/nginx.conf packaging/.dockerignore docker-context/
          cp vectorcraft-src/LICENSE-MIT vectorcraft-src/LICENSE-APACHE docker-context/legal/
          for file in NOTICE ATTRIBUTION.md; do
            if [ -f "vectorcraft-src/$file" ]; then cp "vectorcraft-src/$file" docker-context/legal/; fi
          done
          if [ -d craft-fonts ]; then
            find craft-fonts -type f \( -iname '*OFL*.txt' -o -iname 'LICENSE*' \) -print0 | while IFS= read -r -d '' file; do
              dest="docker-context/legal/craft-fonts/${file#craft-fonts/}"
              mkdir -p "$(dirname "$dest")"
              cp "$file" "$dest"
            done
          fi
          test -s docker-context/site/index.html
          find docker-context/site -name '*.wasm' -type f | grep -q .
          test -d docker-context/site/fonts

      - name: Set image name
        if: steps.release-check.outputs.skip != 'true'
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vectorcraft-web" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.release-check.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        if: steps.release-check.outputs.skip != 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./docker-context
          file: ./docker-context/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.upstream-release.outputs.tag }}
            ${{ steps.image.outputs.name }}:upstream-${{ steps.revisions.outputs.short }}
          labels: |
            org.opencontainers.image.title=VectorCraft Web
            org.opencontainers.image.source=https://github.com/MikaPST/vectorcraft-web
            org.opencontainers.image.revision=${{ steps.revisions.outputs.vectorcraft }}
            io.mikapst.craft-fonts.commit=${{ steps.revisions.outputs.fonts }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create or update MikaPST GitHub Release
        if: steps.release-check.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          UPSTREAM_TAG: ${{ steps.upstream-release.outputs.tag }}
          UPSTREAM_NAME: ${{ steps.upstream-release.outputs.name }}
          UPSTREAM_URL: ${{ steps.upstream-release.outputs.url }}
          UPSTREAM_PUBLISHED_AT: ${{ steps.upstream-release.outputs.published_at }}
          UPSTREAM_PRERELEASE: ${{ steps.upstream-release.outputs.prerelease }}
          UPSTREAM_SHA: ${{ steps.revisions.outputs.vectorcraft }}
          FONTS_SHA: ${{ steps.revisions.outputs.fonts }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        with:
          script: |
            const tag = process.env.UPSTREAM_TAG;
            const { data: upstream } = await github.rest.repos.getReleaseByTag({
              owner: 'storytold', repo: 'vectorcraft', tag
            });
            const image = process.env.IMAGE_NAME;
            const body = [
              `This release packages **${process.env.UPSTREAM_NAME}** as a self-hosted Docker image.`,
              '', '## Docker image',
              `- \`${image}:latest\``,
              `- \`${image}:${tag}\``,
              `- \`${image}:upstream-${process.env.UPSTREAM_SHA.slice(0, 12)}\``,
              '', 'Supported platforms: `linux/amd64`, `linux/arm64`.',
              '', '## Upstream project',
              `- Official release: ${process.env.UPSTREAM_URL}`,
              `- Upstream commit: \`${process.env.UPSTREAM_SHA}\``,
              `- craft-fonts commit: \`${process.env.FONTS_SHA}\``,
              `- Published upstream: ${process.env.UPSTREAM_PUBLISHED_AT || 'not specified'}`,
              '', '## Upstream release notes',
              upstream.body || 'No release notes provided.',
              '', '## Image details',
              `- Image digest: \`${process.env.IMAGE_DIGEST}\``,
              '- Community-maintained packaging; not an official VectorCraft release.'
            ].join('\n');
            let existing;
            try {
              ({ data: existing } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag }));
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const args = {
              ...context.repo, tag_name: tag, name: `VectorCraft Web ${tag}`,
              body, draft: false, prerelease: process.env.UPSTREAM_PRERELEASE === 'true'
            };
            if (existing) {
              await github.rest.repos.updateRelease({ ...args, release_id: existing.id });
            } else {
              await github.rest.repos.createRelease({ ...args, target_commitish: context.sha });
            }
