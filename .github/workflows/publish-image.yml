name: Build and publish VectorCraft Web

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "docker-compose.yml"
      - "README.md"

permissions:
  contents: read
  packages: write

concurrency:
  group: vectorcraft-web-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish multi-platform image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout packaging repository
        uses: actions/checkout@v4

      - name: Checkout VectorCraft source
        run: |
          git clone --depth 1 https://github.com/storytold/vectorcraft.git upstream/vectorcraft
          echo "VECTORCRAFT_COMMIT=$(git -C upstream/vectorcraft rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Checkout craft-fonts source
        run: |
          git clone --depth 1 https://github.com/storytold/craft-fonts.git upstream/craft-fonts
          echo "CRAFT_FONTS_COMMIT=$(git -C upstream/craft-fonts rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/vectorcraft -> target

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build VectorCraft Web
        working-directory: upstream/vectorcraft/apps/vectorcraft-web
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/upstream/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: trunk build --release

      - name: Prepare static website build context
        run: |
          mkdir -p dist/web
          cp -a upstream/vectorcraft/dist/web/. dist/web/
          test -s dist/web/index.html
          test -n "$(find dist/web -type f -name '*.wasm' -print -quit)"
          echo "## Upstream revisions" >> "$GITHUB_STEP_SUMMARY"
          echo "- VectorCraft: \`${VECTORCRAFT_COMMIT}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- craft-fonts: \`${CRAFT_FONTS_COMMIT}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        env:
          VECTORCRAFT_COMMIT: ${{ env.VECTORCRAFT_COMMIT }}
          CRAFT_FONTS_COMMIT: ${{ env.CRAFT_FONTS_COMMIT }}
          SHORT_COMMIT: ${{ env.VECTORCRAFT_COMMIT }}
        shell: bash
        run: |
          SHORT_COMMIT="${VECTORCRAFT_COMMIT:0:12}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --push \
            --tag ghcr.io/mikapst/vectorcraft-web:latest \
            --tag "ghcr.io/mikapst/vectorcraft-web:upstream-${SHORT_COMMIT}" \
            --label "org.opencontainers.image.title=VectorCraft Web" \
            --label "org.opencontainers.image.description=Community-maintained Docker image for VectorCraft Web" \
            --label "org.opencontainers.image.source=https://github.com/MikaPST/vectorcraft-web" \
            --label "org.opencontainers.image.url=https://github.com/storytold/vectorcraft" \
            --label "io.mikapst.vectorcraft.commit=${VECTORCRAFT_COMMIT}" \
            --label "io.mikapst.craft-fonts.commit=${CRAFT_FONTS_COMMIT}" \
            --file - . <<'DOCKERFILE'
          FROM nginx:alpine
          COPY dist/web/ /usr/share/nginx/html/
          RUN printf '%s\n' \
            'server {' \
            '  listen 8080;' \
            '  server_name _;' \
            '  root /usr/share/nginx/html;' \
            '  index index.html;' \
            '  include /etc/nginx/mime.types;' \
            '  types { application/wasm wasm; font/ttf ttf; }' \
            '  gzip on;' \
            '  gzip_vary on;' \
            '  gzip_min_length 1024;' \
            '  gzip_types application/wasm application/javascript text/javascript text/css text/html application/json image/svg+xml;' \
            '  location = /index.html { add_header Cache-Control "no-cache"; try_files $uri =404; }' \
            '  location ~* \.(wasm|js|ttf)$ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }' \
            '  location / { try_files $uri $uri/ =404; }' \
            '}' > /etc/nginx/conf.d/default.conf
          EXPOSE 8080
          HEALTHCHECK --interval=30s --timeout=3s --start-period=10s --retries=3 \
            CMD wget -q --spider http://127.0.0.1:8080/ || exit 1
          DOCKERFILE

      - name: Report published image
        run: |
          {
            echo "## Published image"
            echo "- \`ghcr.io/mikapst/vectorcraft-web:latest\`"
            echo "- \`ghcr.io/mikapst/vectorcraft-web:upstream-${VECTORCRAFT_COMMIT:0:12}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"
